name: Apply iteration 7

on:
  push:
    branches: ["main"]
    paths:
      - ".iter7/**"
      - ".github/workflows/apply-iteration7.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apply-iteration7"
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and apply source
        shell: bash
        run: |
          cat             .iter7/chunks/part00.b64             .iter7/chunks/part01.b64             .iter7/chunks/part02.b64             .iter7/chunks/part03.b64             .iter7/chunks/part04.b64             .iter7/chunks/part05.b64             .iter7/chunks/part06.b64             .iter7/chunks/p07_00.b64             .iter7/chunks/p07_01.b64             .iter7/chunks/p07_02.b64             .iter7/chunks/p07_03.b64             .iter7/chunks/p07_04.b64             .iter7/chunks/p07_05.b64             .iter7/chunks/p07_06.b64             .iter7/chunks/p07_07.b64 > .iter7/source.b64
          test "$(wc -c < .iter7/source.b64)" -eq 47440
          base64 --decode .iter7/source.b64 > .iter7/source-fixed.tar.gz
          echo "0beba4a6d9bfea709c15d691a28d9c139ffacc2702e83ab50d8b52088b912f8c  .iter7/source-fixed.tar.gz" | sha256sum -c -
          tar -xzf .iter7/source-fixed.tar.gz

          # GitHub Actions' token cannot update workflow files. Keep the
          # repository workflows exactly as they were at checkout; the
          # connector removes this temporary workflow after the source commit.
          git checkout HEAD -- .github/workflows/deploy-pages.yml .github/workflows/apply-iteration7.yml
          rm -rf .iter7

      - name: Commit iteration 7 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Ruinas del Ocaso iteration 7"
          git push
