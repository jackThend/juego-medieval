name: Apply iteration 3

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "update-iteration3/**"
      - ".github/workflows/apply-iteration3.yml"

permissions:
  contents: write

concurrency:
  group: "apply-iteration3"
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify staged chunks
        shell: bash
        run: |
          echo "1c57bca9c1b962809ff02670261c7818e1cdfc19ce8e4762d243014fc30f1890  update-iteration3/part00.b64" | sha256sum -c -
          echo "38d0d53439f086dae7b7727f7051a8f521a9b75a63b2a75c0eecd4510cada091  update-iteration3/part01.b64" | sha256sum -c -
          echo "cc6de1ec0e82b60a617c3ac98b25c3a6aa5bad7cca0c937757e55dca40c7c4d3  update-iteration3/part02.b64" | sha256sum -c -
          echo "1c01e5eb265d69868802531bcdd6bdcf186e9589bd567cf0bea4769312b3b562  update-iteration3/part03.b64" | sha256sum -c -
          echo "34650c3ae5620ef240ea4d27fa8f36a85cf98a2f7799aa40859ea4b0ca3781e8  update-iteration3/part04.b64" | sha256sum -c -
          echo "8fcfd11069601099f8eecd7b6cf34edbb51493f1de0ba62e58c5f6e9853834bd  update-iteration3/part05.b64" | sha256sum -c -
          echo "81bf12e348bf6d0388fa49d8d0668255f3b5bfe6835ec8f66639bf50708cfc11  update-iteration3/part06.b64" | sha256sum -c -
          echo "99bbd7ec26d483630a0784237173d5a6f983820368f5cc8bdd49b24ec568358d  update-iteration3/part07.b64" | sha256sum -c -

      - name: Reconstruct and apply iteration 3
        shell: bash
        run: |
          cat update-iteration3/part*.b64 > iteration3-source.b64
          test "$(wc -c < iteration3-source.b64)" -eq 39248
          base64 --decode iteration3-source.b64 > iteration3-source.tar.gz
          echo "a577baf74bc7542031cf80eb44910244878dfcb1778ec276dc44eedf2f7a8a36  iteration3-source.tar.gz" | sha256sum -c -

          mkdir unpacked
          tar -xzf iteration3-source.tar.gz -C unpacked

          rm -rf src scripts
          cp unpacked/package.json unpacked/index.html unpacked/vite.config.js .
          cp -R unpacked/src unpacked/scripts .

          rm -rf update-iteration3 iteration3-source.b64 iteration3-source.tar.gz unpacked
          rm -f .github/workflows/apply-iteration3.yml

      - name: Commit iteration 3
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Ruinas del Ocaso iteration 3"
          git push
