name: Deploy Ruinas del Ocaso

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source
        shell: bash
        run: |
          mkdir app
          if [ -f package.json ]; then
            cp package.json index.html vite.config.js app/
            cp -R src scripts app/
          else
            cat \
              source-parts/part00.b64 \
              source-parts/part01.b64 \
              source-parts/part02.b64 \
              source-parts/fix03a0.b64 \
              source-parts/fix03a1.b64 \
              source-parts/fix03a2.b64 \
              source-parts/fix03b.b64 \
              source-parts/fix03c.b64 \
              source-parts/fix03d.b64 \
              source-parts/part04.b64 \
              source-parts/part05.b64 \
              source-parts/part06.b64 > source.tar.gz.b64
            test "$(wc -c < source.tar.gz.b64)" -eq 39584
            base64 --decode source.tar.gz.b64 > source.tar.gz
            echo "5ac1edb112ce3fc5efff7cc26ee0d87ea779b0f9245e888f30e4de76c4615a04  source.tar.gz" | sha256sum -c -
            tar -xzf source.tar.gz -C app
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Validate source
        working-directory: app
        run: npm run check

      - name: Build production site
        working-directory: app
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
